<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dwarf Mini Stargazer - Pro Edition (150+ Objects)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070b12;
      --panel: #0d1420;
      --panel-2: #101a28;
      --line: #1b3146;
      --cyan: #55e7ff;
      --cyan-soft: #9aeeff;
      --pink: #ff62c7;
      --text: #e8f7ff;
      --muted: #91a8ba;
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 20%, #0d1a29 0%, #070b12 48%, #04070c 100%);
      color: var(--text);
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }
    .panel {
      width: 330px;
      min-width: 330px;
      background: linear-gradient(180deg, #101927 0%, #0b121d 100%);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      z-index: 10;
    }
    .panel-right { border-right: none; border-left: 1px solid var(--line); }
    .viewport {
      flex: 1;
      background: #04070c;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: grab;
      overflow: hidden;
    }
    .viewport:active { cursor: grabbing; }
    svg {
      width: 100%;
      height: 100%;
      background: #04070c;
    }
    h2 { font-size: 0.95rem; color: var(--cyan); margin-top: 5px; text-transform: uppercase; letter-spacing: 1.2px; }
    label { font-size: 0.8rem; color: var(--muted); display: block; margin-top: 4px; }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      background: #09111b;
      border: 1px solid var(--line);
      color: var(--cyan);
      font-weight: bold;
      border-radius: 4px;
      margin-top: 2px;
    }
    input[type="text"] { color: #ffffff; font-weight: normal; }
    button {
      background: #00d2ff;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 2px;
      transition: background 0.15s;
    }
    button:hover { background: #33d9ff; }
    
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #09111b;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--line);
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #e0e6ed;
      cursor: pointer;
    }
    .filter-item input { accent-color: var(--cyan); cursor: pointer; }

    .card {
      background: #09111b;
      padding: 10px;
      border-radius: 4px;
      border-left: 3px solid #00d2ff;
      font-size: 0.8rem;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .card:hover { background: linear-gradient(180deg, #101927 0%, #0b121d 100%); }
    .card.selected { border-left-color: #ff0055 !important; background: #1c2230; }
    .card.solarsystem { border-left-color: #ffb703; }
    .card.nebula { border-left-color: #ff64c8; }
    .card.cluster { border-left-color: #00ffaa; }

    .card-thumb {
      width: 50px;
      height: 50px;
      border-radius: 4px;
      background: #04070c;
      object-fit: cover;
      border: 1px solid var(--line);
      flex-shrink: 0;
    }
    
    .card-info { flex: 1; min-width: 0; }

    .badge {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 6px;
      background: rgba(0,210,255,0.2);
      color: var(--cyan);
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    /* FOV Inspector & Wiki Container */
    .fov-box {
      background: #09111b;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .preview-container {
      width: 100%;
      height: 160px;
      background: #020305;
      border: 1px solid #00d2ff44;
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      overflow: hidden;
    }
    .wiki-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    #fovCanvas {
      width: 100%;
      height: 100%;
    }
    .fov-details { font-size: 0.75rem; color: #a0aec0; margin-top: 8px; line-height: 1.4; }
    .fov-details strong { color: var(--cyan); }
    .wiki-desc {
      font-size: 0.72rem;
      color: #718096;
      margin-top: 6px;
      line-height: 1.3;
      max-height: 55px;
      overflow-y: auto;
    }
    .wiki-desc a { color: var(--cyan); text-decoration: none; }
    .wiki-desc a:hover { text-decoration: underline; }

    .target-node { cursor: pointer; }
    .target-node text {
      font-family: "SF Mono", "Roboto Mono", "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.25px;
      paint-order: stroke;
      stroke: #03070d;
      stroke-width: 4px;
      stroke-linejoin: round;
      dominant-baseline: middle;
    }
    .target-node:hover text {
      font-size: 13px;
      fill: #ffffff !important;
    }
    .target-node:hover circle { stroke: #ffffff; stroke-width: 2px; }

    /* Light cyberpunk HUD treatment */
    .panel {
      box-shadow: inset -1px 0 rgba(85,231,255,0.05), 8px 0 30px rgba(0,0,0,0.18);
    }
    .panel-right {
      box-shadow: inset 1px 0 rgba(85,231,255,0.05), -8px 0 30px rgba(0,0,0,0.18);
    }
    .panel h2::before {
      content: "▸ ";
      opacity: 0.8;
    }
    .map-btn {
      backdrop-filter: blur(8px);
      background: rgba(12,22,34,0.88);
      border-color: #28506a;
      box-shadow: 0 0 12px rgba(85,231,255,0.08), 0 8px 18px rgba(0,0,0,0.35);
    }
    .map-btn:hover {
      background: #122638;
      color: #ffffff;
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(85,231,255,0.18);
    }
    .map-hint {
      background: rgba(6,12,19,0.78);
      border-color: #24465d;
      color: #8eaabd;
      box-shadow: 0 0 12px rgba(85,231,255,0.04);
    }
    input[type="number"], input[type="text"] {
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="number"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(85,231,255,0.08), 0 0 14px rgba(85,231,255,0.07);

    .constellation-line {
      stroke: #52627a;
      stroke-width: 1;
      stroke-opacity: 0.48;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .constellation-name {
      fill: #7f8ea8;
      fill-opacity: 0.72;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: #05070a;
      stroke-width: 3px;
      stroke-opacity: 0.85;
    }

    /* Map Overlay HUD controls */
    .map-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }
    .map-btn {
      width: 32px;
      height: 32px;
      background: linear-gradient(180deg, #101927 0%, #0b121d 100%);
      border: 1px solid var(--line);
      color: var(--cyan);
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(85,231,255,0.03), 0 8px 22px rgba(0,0,0,0.35);

    .map-hint {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(11, 14, 20, 0.75);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      color: #8892b0;
      pointer-events: none;
      border: 1px solid var(--line);
    }
  </style>
</head>

  <div class="panel">

      <label class="filter-item">

  </div>

      <!-- Constellations are rendered here so they stay behind the DSO targets -->
      <g id="constellationsGroup" pointer-events="none"></g>
      <g id="targetsGroup"></g>
    </svg>
  </div>

    <div class="fov-box">

    <input type="text" id="txtSearch" placeholder="Search 150+ targets (M, NGC, IC, Planets)...">
    <div id="targetList" style="margin-top: 8px;"></div>
  </div>

const RAD = Math.PI / 180;
const DEG = 180 / Math.PI;
let selectedTargetId = "m31";
const wikiCache = {};

function norm(deg) { return (deg % 360 + 360) % 360; }

function getSolarSystemObjects(now) {
  const d = (now - new Date(Date.UTC(2000, 0, 1, 12, 0, 0))) / 86400000;
  const L = norm(280.466 + 0.9856474 * d);
  const g = norm(357.528 + 0.9856003 * d) * RAD;
  const sunEclLng = norm(L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g));
  const eps = 23.439 * RAD;
  const sunRa = norm(Math.atan2(Math.cos(eps) * Math.sin(sunEclLng * RAD), Math.cos(sunEclLng * RAD)) * DEG);
  const sunDec = Math.asin(Math.sin(eps) * Math.sin(sunEclLng * RAD)) * DEG;
  
  const Lm = norm(218.316 + 13.176396 * d);
  const Mm = norm(134.963 + 13.064993 * d) * RAD;
  const F = norm(93.272 + 13.229350 * d) * RAD;
  const moonEclLng = norm(Lm + 6.289 * Math.sin(Mm));
  const moonEclLat = 5.128 * Math.sin(F);
  const moonRa = norm(Math.atan2(Math.sin(moonEclLng * RAD) * Math.cos(eps) - Math.tan(moonEclLat * RAD) * Math.sin(eps), Math.cos(moonEclLng * RAD)) * DEG);
  const moonDec = Math.asin(Math.sin(moonEclLat * RAD) * Math.cos(eps) + Math.cos(moonEclLat * RAD) * Math.sin(eps) * Math.sin(moonEclLng * RAD)) * DEG;
  const illuminated = Math.round((1 - Math.cos(norm(moonEclLng - sunEclLng) * RAD)) / 2 * 100);

  return [
    { id: "sun", name: "Sun", wikiQuery: "Sun", ra: sunRa, dec: sunDec, mag: -26.7, category: "SolarSystem", typeName: "Star / Solar", color: "#ffcc00", sizeArcmin: 32 },
    { id: "moon", name: `Moon (${illuminated}% Illum)`, wikiQuery: "Moon", ra: moonRa, dec: moonDec, mag: -12.6, category: "SolarSystem", typeName: "Moon", color: "#e6e6e6", sizeArcmin: 31 },
    { id: "mercury", name: "Mercury", wikiQuery: "Mercury_(planet)", ra: norm(sunRa + 12), dec: 8, mag: -0.4, category: "SolarSystem", typeName: "Planet", color: "#ffb703", sizeArcmin: 0.15 },
    { id: "venus", name: "Venus", wikiQuery: "Venus", ra: norm(sunRa + 35), dec: 18, mag: -4.2, category: "SolarSystem", typeName: "Planet", color: "#ffea00", sizeArcmin: 0.4 },
    { id: "mars", name: "Mars", wikiQuery: "Mars", ra: norm(sunRa + 85), dec: 22, mag: 0.5, category: "SolarSystem", typeName: "Planet", color: "#ff5533", sizeArcmin: 0.25 },
    { id: "jupiter", name: "Jupiter", wikiQuery: "Jupiter", ra: norm(sunRa + 120), dec: 15, mag: -2.3, category: "SolarSystem", typeName: "Planet", color: "#ffb703", sizeArcmin: 0.75 },
    { id: "saturn", name: "Saturn", wikiQuery: "Saturn", ra: norm(sunRa + 160), dec: -10, mag: 0.6, category: "SolarSystem", typeName: "Planet", color: "#ffb703", sizeArcmin: 0.3 },
    { id: "uranus", name: "Uranus", wikiQuery: "Uranus", ra: norm(sunRa + 195), dec: -2, mag: 5.7, category: "SolarSystem", typeName: "Ice Giant Planet", color: "#00d2ff", sizeArcmin: 0.06 },
    { id: "neptune", name: "Neptune", wikiQuery: "Neptune", ra: norm(sunRa + 225), dec: -5, mag: 7.8, category: "SolarSystem", typeName: "Ice Giant Planet", color: "#3355ff", sizeArcmin: 0.04 }
  ];
}

async function fetchWikiData(wikiQuery) {
  if (!wikiQuery) return null;
  if (wikiCache[wikiQuery]) return wikiCache[wikiQuery];
  try {
    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiQuery)}`);
    if (!res.ok) return null;
    const data = await res.json();
    wikiCache[wikiQuery] = {
      thumbnail: data.thumbnail ? data.thumbnail.source : null,
      extract: data.extract || "",
      pageUrl: data.content_urls ? data.content_urls.desktop.page : "#"
    };
    return wikiCache[wikiQuery];
  } catch (err) {
    return null;
  }
}

function calcExposure(category, mag) {
  if (category === "SolarSystem") return "Instant / Solar Filter";
  let base = category === "Cluster" ? 3 : (category === "Galaxy" ? 15 : 10);
  const mins = Math.min(60, Math.max(2, Math.round(base * Math.pow(1.35, Math.max(0, mag - 4)))));
  return mins < 60 ? `${mins} mins` : "1 hr+";
}

function getAzDiff(targetAz, centerAz) {
  let diff = (targetAz - centerAz) % 360;
  if (diff < -180) diff += 360;
  if (diff > 180) diff -= 360;
  return diff;
}

function raDecToAltAz(raDeg, decDeg, latDeg, lngDeg, now) {
  const lat = latDeg * RAD;
  const dec = decDeg * RAD;
  const d = (now - new Date(Date.UTC(2000, 0, 1, 12, 0, 0))) / 86400000;
  const gst = (280.4606183 + 360.98564736629 * d) % 360;
  const lst = (gst + lngDeg + 360) % 360;
  const ha = (lst - raDeg + 360) % 360 * RAD;
  const alt = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(-Math.cos(dec) * Math.sin(ha), Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.sin(lat) * Math.cos(ha));
  return { alt: alt / RAD, az: (az / RAD + 360) % 360 };
}

// ---------------------------------------------------------------------------
// Constellation overlay
// Data: D3-Celestial / IAU constellation data, in J2000 equatorial
// coordinates. GeoJSON longitude is RA in the range -180..180.
// ---------------------------------------------------------------------------
let constellationLinesData = null;
let constellationNamesData = null;
let constellationsLoading = false;

const CONSTELLATION_LINES_URL =
  "https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/constellations.lines.json";
const CONSTELLATION_NAMES_URL =
  "https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/constellations.json";

function constellationLonToRa(lon) {
  return lon < 0 ? lon + 360 : lon;
}

function constellationSkyPosition(ra, dec, lat, lng, now, centerAz, fov) {
  const pos = raDecToAltAz(ra, dec, lat, lng, now);
  const azDiff = getAzDiff(pos.az, centerAz);

  return {
    alt: pos.alt,
    az: pos.az,
    azDiff: azDiff,
    x: 400 + (azDiff / (fov / 2)) * 400,
    y: 500 * (1 - (pos.alt / 90))
  };
}

function renderConstellations(lat, lng, now, centerAz, fov, minAlt) {
  const group = document.getElementById("constellationsGroup");
  if (!group) return;

  group.innerHTML = "";

  if (!constellationLinesData || !constellationNamesData) return;

  const NS = "http://www.w3.org/2000/svg";

  // Draw the constellation stick figures first.
  constellationLinesData.features.forEach(feature => {
    if (!feature.geometry || feature.geometry.type !== "MultiLineString") return;

    feature.geometry.coordinates.forEach(line => {
      for (let i = 1; i < line.length; i++) {
        const a = line[i - 1];
        const b = line[i];

        const pa = constellationSkyPosition(
          constellationLonToRa(a[0]), a[1],
          lat, lng, now, centerAz, fov
        );
        const pb = constellationSkyPosition(
          constellationLonToRa(b[0]), b[1],
          lat, lng, now, centerAz, fov
        );

        if (pa.alt < minAlt && pb.alt < minAlt) continue;
        if (Math.abs(pa.azDiff) > fov / 2 && Math.abs(pb.azDiff) > fov / 2) continue;

        // Do not draw a false line across the left/right FOV edge.
        if (Math.abs(pa.x - pb.x) > 500) continue;

        const segment = document.createElementNS(NS, "line");
        segment.setAttribute("class", "constellation-line");
        segment.setAttribute("x1", pa.x);
        segment.setAttribute("y1", pa.y);
        segment.setAttribute("x2", pb.x);
        segment.setAttribute("y2", pb.y);
        group.appendChild(segment);
      }
    });
  });

  // Draw the IAU constellation names.
  constellationNamesData.features.forEach(feature => {
    if (!feature.geometry || feature.geometry.type !== "Point") return;

    const coord = feature.geometry.coordinates;
    const p = constellationSkyPosition(
      constellationLonToRa(coord[0]), coord[1],
      lat, lng, now, centerAz, fov
    );

    if (p.alt < minAlt || Math.abs(p.azDiff) > fov / 2) return;

    const label = document.createElementNS(NS, "text");
    label.setAttribute("class", "constellation-name");
    label.setAttribute("x", p.x);
    label.setAttribute("y", p.y);
    label.textContent =
      (feature.properties && feature.properties.name) || feature.id || "";

    if (feature.properties && String(feature.properties.rank) === "1") {
      label.setAttribute("font-size", "14");
    } else if (feature.properties && String(feature.properties.rank) === "3") {
      label.setAttribute("font-size", "11");
    }

    group.appendChild(label);
  });
}

async function loadConstellations() {
  if (constellationsLoading || (constellationLinesData && constellationNamesData)) return;

  constellationsLoading = true;

  try {
    const [linesResponse, namesResponse] = await Promise.all([
      fetch(CONSTELLATION_LINES_URL),
      fetch(CONSTELLATION_NAMES_URL)
    ]);

    if (!linesResponse.ok || !namesResponse.ok) {
      throw new Error("Unable to load constellation data");
    }

    constellationLinesData = await linesResponse.json();
    constellationNamesData = await namesResponse.json();

    // Render again using the current location/time/FOV.
    render();
  } catch (err) {
    // The overlay is optional: never let it break the existing application.
    console.warn("Constellation overlay unavailable:", err);
  } finally {
    constellationsLoading = false;
  }
}

async function renderFraming(obj, pos) {
  const canvas = document.getElementById('fovCanvas');
  const wikiImg = document.getElementById('wikiImg');
  const wikiSummary = document.getElementById('wikiSummary');
  const ctx = canvas.getContext('2d');
  
  document.getElementById('fovTitle').textContent = obj.name;
  
  const wikiData = await fetchWikiData(obj.wikiQuery);
  
  if (wikiData && wikiData.thumbnail) {
    wikiImg.src = wikiData.thumbnail;
    wikiImg.style.display = 'block';
    canvas.style.display = 'none';
  } else {
    wikiImg.style.display = 'none';
    canvas.style.display = 'block';
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffffff";
    for(let i = 0; i < 25; i++) {
      const sx = (Math.sin(i * 99 + obj.ra) * 0.5 + 0.5) * canvas.width;
      const sy = (Math.cos(i * 33 + obj.dec) * 0.5 + 0.5) * canvas.height;
      ctx.beginPath();
      ctx.arc(sx, sy, 1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (wikiData && wikiData.extract) {
    wikiSummary.innerHTML = `${wikiData.extract.substring(0, 120)}... <a href="${wikiData.pageUrl}" target="_blank">Wikipedia ↗</a>`;
  } else {
    wikiSummary.innerHTML = "";
  }

  const dwarfFovArcmin = 84; 
  const fitPercentage = Math.round((obj.sizeArcmin / dwarfFovArcmin) * 100);
  document.getElementById('fovMetrics').innerHTML = `
    <strong>Type:</strong> ${obj.typeName}<br>
    <strong>Apparent Size:</strong> ${obj.sizeArcmin}' arcmin<br>
    <strong>FOV Coverage:</strong> ~${fitPercentage}% of Dwarf Sensor Field<br>
    <strong>Altitude:</strong> ${pos.alt.toFixed(1)}° | <strong>Azimuth:</strong> ${pos.az.toFixed(1)}°<br>
    <strong>Est. Stack Time:</strong> ${calcExposure(obj.category, obj.mag)}
  `;
}

async function renderListThumbnails(visibleObjects) {
  for (const obj of visibleObjects) {
    const thumbElem = document.getElementById(`thumb-${obj.id}`);
    if (thumbElem && obj.wikiQuery) {
      const wikiData = await fetchWikiData(obj.wikiQuery);
      if (wikiData && wikiData.thumbnail) {
        thumbElem.src = wikiData.thumbnail;
      }
    }
  }
}

function render() {
  const lat = parseFloat(document.getElementById('lat').value) || 0;
  const lng = parseFloat(document.getElementById('lng').value) || 0;
  const centerAz = parseFloat(document.getElementById('azimuth').value) || 300;
  const fov = parseFloat(document.getElementById('fov').value) || 90;
  const minAlt = parseFloat(document.getElementById('minAlt').value) || 20;
  const searchText = (document.getElementById('txtSearch').value || "").toLowerCase().trim();

  const showSolar = document.getElementById('chkSolar').checked;
  const showGalaxies = document.getElementById('chkGalaxy').checked;
  const showNebulae = document.getElementById('chkNebula').checked;
  const showClusters = document.getElementById('chkCluster').checked;
  const showStars = document.getElementById('chkStar').checked;

  const horizonY = 500 * (1 - (minAlt / 90));
  document.getElementById('horizon').setAttribute('y', horizonY);
  document.getElementById('horizon').setAttribute('height', 500 - horizonY);
  document.getElementById('horizonLine').setAttribute('y1', horizonY);
  document.getElementById('horizonLine').setAttribute('y2', horizonY);

  const targetsGroup = document.getElementById('targetsGroup');
  const targetList = document.getElementById('targetList');
  targetsGroup.innerHTML = '';
  targetList.innerHTML = '';

  const now = new Date();

  // Constellations are a background layer, before targetsGroup.
  renderConstellations(lat, lng, now, centerAz, fov, minAlt);

  const solarSystemObjects = getSolarSystemObjects(now);
  const fullCatalog = [...solarSystemObjects, ...CATALOG_DSO];

  let selectedObjObj = null;
  let selectedObjPos = null;
  let visibleCount = 0;
  let visibleObjectsList = [];

  fullCatalog.forEach(obj => {
    if (obj.category === 'SolarSystem' && !showSolar) return;
    if (obj.category === 'Galaxy' && !showGalaxies) return;
    if (obj.category === 'Nebula' && !showNebulae) return;
    if (obj.category === 'Cluster' && !showClusters) return;
    if (obj.category === 'Star' && !showStars) return;

    const pos = raDecToAltAz(obj.ra, obj.dec, lat, lng, now);
    const azDiff = getAzDiff(pos.az, centerAz);
    const inWindow = Math.abs(azDiff) <= fov / 2;
    const isVisible = inWindow && pos.alt >= minAlt;
    const isSelected = obj.id === selectedTargetId;

    if (isSelected) {
      selectedObjObj = obj;
      selectedObjPos = pos;
    }

    if (inWindow) {
      const x = 400 + (azDiff / (fov / 2)) * 400;
      const y = 500 * (1 - (pos.alt / 90));

      let dotColor = "#00d2ff";
      if (obj.category === 'Star') dotColor = "#ffffff";
      else if (obj.category === 'Nebula') dotColor = "#ff64c8";
      else if (obj.category === 'Cluster') dotColor = "#00ffaa";
      else if (obj.category === 'SolarSystem') dotColor = obj.color || "#ffb703";

      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", "target-node");
      group.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedTargetId = obj.id;
        render();
      });

      if (isSelected) {
        const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        ring.setAttribute("cx", x); ring.setAttribute("cy", y); ring.setAttribute("r", "14");
        ring.setAttribute("fill", "none"); ring.setAttribute("stroke", "#ff0055");
        ring.setAttribute("stroke-width", "2"); ring.setAttribute("stroke-dasharray", "3 2");
        group.appendChild(ring);
      }

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", x); circle.setAttribute("cy", y); circle.setAttribute("r", "6");
      circle.setAttribute("fill", isVisible ? (isSelected ? "#ff0055" : dotColor) : "#555555");
      group.appendChild(circle);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", x + 10); text.setAttribute("y", y + 4);
      text.setAttribute("fill", isSelected ? "#ff0055" : (isVisible ? "#ffffff" : "#777777"));
      text.setAttribute("font-size", isSelected ? "14" : "11");
      text.textContent = `${obj.name} (${pos.alt.toFixed(1)}°)`;
      group.appendChild(text);

      targetsGroup.appendChild(group);

      const matchesSearch = searchText === "" || obj.name.toLowerCase().includes(searchText) || obj.typeName.toLowerCase().includes(searchText);

      if (isVisible && obj.category !== 'Star' && matchesSearch) {
        visibleCount++;
        visibleObjectsList.push(obj);
        
        const card = document.createElement('div');
        card.className = `card ${obj.category.toLowerCase()} ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `
          <img id="thumb-${obj.id}" class="card-thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><rect width='50' height='50' fill='%2305070a'/></svg>" alt="Preview">
          <div class="card-info">
            <strong>${obj.name}</strong><br>
            Mag: ${obj.mag} | Alt: ${pos.alt.toFixed(1)}°<br>
            <div class="badge">⏱ ${calcExposure(obj.category, obj.mag)}</div>
          </div>
        `;
        card.addEventListener('click', () => {
          selectedTargetId = obj.id;
          render();
        });
        targetList.appendChild(card);
      }
    }
  });

  document.getElementById('visibleCount').textContent = visibleCount;

  if (selectedObjObj && selectedObjPos) {
    renderFraming(selectedObjObj, selectedObjPos);
  }
  
  renderListThumbnails(visibleObjectsList);
}

// Mouse Navigation Controls
const viewport = document.getElementById('viewport');
let isDragging = false, startX = 0, startAzimuth = 0;

viewport.addEventListener('mousedown', (e) => {
  if (e.target.closest('.map-controls')) return;
  isDragging = true; startX = e.clientX;
  startAzimuth = parseFloat(document.getElementById('azimuth').value) || 300;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - startX;
  const currentFov = parseFloat(document.getElementById('fov').value) || 90;
  document.getElementById('azimuth').value = Math.round(norm(startAzimuth - (dx / viewport.clientWidth) * currentFov));
  render();
});

window.addEventListener('mouseup', () => { isDragging = false; });

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  let fovInput = document.getElementById('fov');
  fovInput.value = Math.min(180, Math.max(20, (parseFloat(fovInput.value) || 90) + (e.deltaY > 0 ? 5 : -5)));
  render();
}, { passive: false });

document.getElementById('btnZoomIn').addEventListener('click', () => {
  document.getElementById('fov').value = Math.max(20, (parseFloat(document.getElementById('fov').value) || 90) - 15);
  render();
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  document.getElementById('fov').value = Math.min(180, (parseFloat(document.getElementById('fov').value) || 90) + 15);
  render();
});
document.getElementById('btnReset').addEventListener('click', () => {
  document.getElementById('azimuth').value = 300;
  document.getElementById('fov').value = 90;
  render();
});

['lat', 'lng', 'azimuth', 'fov', 'minAlt', 'chkSolar', 'chkGalaxy', 'chkNebula', 'chkCluster', 'chkStar', 'txtSearch'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

document.getElementById('btnGps').addEventListener('click', () => {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(p => {
      document.getElementById('lat').value = p.coords.latitude.toFixed(4);
      document.getElementById('lng').value = p.coords.longitude.toFixed(4);
      render();
    });
  }
});

// Load constellation data independently so a network failure never affects
// the existing DSO application.
loadConstellations();
render();
</script>
