<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dwarf Mini Stargazer - Ultra (100+ Objects)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0e14;
      color: #e0e6ed;
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }
    .panel {
      width: 320px;
      min-width: 320px;
      background: #151922;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      border-right: 1px solid #232936;
      z-index: 10;
    }
    .panel-right { border-right: none; border-left: 1px solid #232936; }
    .viewport {
      flex: 1;
      background: #05070a;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: grab;
      overflow: hidden;
    }
    .viewport:active { cursor: grabbing; }
    svg {
      width: 100%;
      height: 100%;
      background: #05070a;
    }
    h2 { font-size: 0.95rem; color: #00d2ff; margin-top: 5px; }
    label { font-size: 0.8rem; color: #8892b0; display: block; margin-top: 4px; }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      background: #0b0e14;
      border: 1px solid #232936;
      color: #00d2ff;
      font-weight: bold;
      border-radius: 4px;
      margin-top: 2px;
    }
    input[type="text"] { color: #ffffff; font-weight: normal; }
    button {
      background: #00d2ff;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 2px;
      transition: background 0.15s;
    }
    button:hover { background: #33d9ff; }
    
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #0b0e14;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #232936;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #e0e6ed;
      cursor: pointer;
    }
    .filter-item input { accent-color: #00d2ff; cursor: pointer; }

    .card {
      background: #0b0e14;
      padding: 10px;
      border-radius: 4px;
      border-left: 3px solid #00d2ff;
      font-size: 0.8rem;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .card:hover { background: #151922; }
    .card.selected { border-left-color: #ff0055 !important; background: #1c2230; }
    .card.solar-sys { border-left-color: #ffb703; }
    .card.nebula { border-left-color: #ff64c8; }
    .card.cluster { border-left-color: #00ffaa; }
    
    .badge {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 6px;
      background: rgba(0,210,255,0.2);
      color: #00d2ff;
      border-radius: 3px;
      font-weight: bold;
    }
    .badge.solar { background: rgba(255,183,3,0.2); color: #ffb703; }

    /* FOV Inspector */
    .fov-box {
      background: #0b0e14;
      border: 1px solid #232936;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .fov-canvas-container {
      width: 100%;
      height: 160px;
      background: #020305;
      border: 1px solid #00d2ff44;
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      overflow: hidden;
    }
    .fov-details { font-size: 0.75rem; color: #a0aec0; margin-top: 8px; line-height: 1.4; }
    .fov-details strong { color: #00d2ff; }

    .target-node { cursor: pointer; }
    .target-node:hover circle { stroke: #ffffff; stroke-width: 2px; }

    /* Map Overlay HUD controls */
    .map-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }
    .map-btn {
      width: 32px;
      height: 32px;
      background: #151922;
      border: 1px solid #232936;
      color: #00d2ff;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .map-btn:hover { background: #232936; color: #fff; }
    .map-hint {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(11, 14, 20, 0.75);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      color: #8892b0;
      pointer-events: none;
      border: 1px solid #232936;
    }
  </style>
</head>

  <!-- CONTROL PANEL -->
  <div class="panel">
    <h2>Observer Location</h2>
    <button id="btnGps">Detect GPS Location</button>
    
    <label for="lat">Latitude (°)</label>
    <input type="number" id="lat" value="38.1157" step="0.0001">
    
    <label for="lng">Longitude (°)</label>
    <input type="number" id="lng" value="13.3613" step="0.0001">

    <h2>Window Settings</h2>
    <label for="azimuth">Facing Azimuth (° Center)</label>
    <input type="number" id="azimuth" value="300" min="0" max="360">
    
    <label for="fov">Field of View FOV (° Wide)</label>
    <input type="number" id="fov" value="90" min="20" max="180">

    <label for="minAlt">Min Horizon Height (°)</label>
    <input type="number" id="minAlt" value="20" min="0" max="80">

    <h2>Filter Object Types</h2>
    <div class="filter-group">
      <label class="filter-item">
        <input type="checkbox" id="chkSolar" checked> Solar System
      </label>
      <label class="filter-item">
        <input type="checkbox" id="chkGalaxy" checked> Galaxies
      </label>
      <label class="filter-item">
        <input type="checkbox" id="chkNebula" checked> Nebulae
      </label>
      <label class="filter-item">
        <input type="checkbox" id="chkCluster" checked> Clusters
      </label>
      <label class="filter-item">
        <input type="checkbox" id="chkStar" checked> Reference Stars
      </label>
    </div>
  </div>

  <!-- SVG SKY RENDER -->
  <div class="viewport" id="viewport">
    <div class="map-controls">
      <div class="map-btn" id="btnZoomIn" title="Zoom In (+)">+</div>
      <div class="map-btn" id="btnZoomOut" title="Zoom Out (−)">−</div>
      <div class="map-btn" id="btnReset" title="Reset View">⟲</div>

    <div class="map-hint">🖱️ Drag to Pan Azimuth | Scroll Wheel to Zoom FOV</div>

    <svg id="sky" viewBox="0 0 800 500" preserveAspectRatio="none">
      <line x1="0" y1="125" x2="800" y2="125" stroke="#1f293d" stroke-dasharray="4"/>
      <line x1="0" y1="250" x2="800" y2="250" stroke="#1f293d" stroke-dasharray="4"/>
      <line x1="400" y1="0" x2="400" y2="500" stroke="#1f293d" stroke-dasharray="4"/>
      
      <rect id="horizon" x="0" y="388" width="800" height="112" fill="#1c1313"/>
      <line id="horizonLine" x1="0" y1="388" x2="800" y2="388" stroke="#ff4444" stroke-width="2"/>
      
      <g id="targetsGroup"></g>
    </svg>
  </div>

  <!-- VISIBLE TARGETS & FOV PANEL -->
  <div class="panel panel-right">
    <h2>Sensor Framing FOV</h2>
    <div class="fov-box">
      <div id="fovTitle" style="font-weight: bold; color: #ff0055;">Select a target</div>
      <div class="fov-canvas-container">
        <canvas id="fovCanvas" width="260" height="160"></canvas>
      </div>
      <div class="fov-details" id="fovMetrics">
        Click any target dot on the map or list below to preview sensor framing & field details.

    </div>

    <div id="targetList" style="margin-top: 8px;"></div>
  </div>

const RAD = Math.PI / 180;
const DEG = 180 / Math.PI;
let selectedTargetId = "m31";

function norm(deg) { return (deg % 360 + 360) % 360; }

function getSolarSystemObjects(now) {
  const d = (now - new Date(Date.UTC(2000, 0, 1, 12, 0, 0))) / 86400000;
  
  const L = norm(280.466 + 0.9856474 * d);
  const g = norm(357.528 + 0.9856003 * d) * RAD;
  const sunEclLng = norm(L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g));
  const eps = 23.439 * RAD;
  
  const sunRa = norm(Math.atan2(Math.cos(eps) * Math.sin(sunEclLng * RAD), Math.cos(sunEclLng * RAD)) * DEG);
  const sunDec = Math.asin(Math.sin(eps) * Math.sin(sunEclLng * RAD)) * DEG;
  
  const Lm = norm(218.316 + 13.176396 * d);
  const Mm = norm(134.963 + 13.064993 * d) * RAD;
  const F = norm(93.272 + 13.229350 * d) * RAD;
  
  const moonEclLng = norm(Lm + 6.289 * Math.sin(Mm));
  const moonEclLat = 5.128 * Math.sin(F);
  
  const moonRa = norm(Math.atan2(Math.sin(moonEclLng * RAD) * Math.cos(eps) - Math.tan(moonEclLat * RAD) * Math.sin(eps), Math.cos(moonEclLng * RAD)) * DEG);
  const moonDec = Math.asin(Math.sin(moonEclLat * RAD) * Math.cos(eps) + Math.cos(moonEclLat * RAD) * Math.sin(eps) * Math.sin(moonEclLng * RAD)) * DEG;
  
  const phaseAngle = norm(moonEclLng - sunEclLng);
  const illuminated = Math.round((1 - Math.cos(phaseAngle * RAD)) / 2 * 100);

  const planets = [
    { id: "mercury", name: "Mercury", N: 48.33, i: 7.00, w: 29.12, a: 0.387, e: 0.2056, M0: 174.79, n: 4.0923, mag: -0.2, sizeArcmin: 0.15 },
    { id: "venus", name: "Venus", N: 76.68, i: 3.39, w: 54.88, a: 0.723, e: 0.0067, M0: 50.11, n: 1.6021, mag: -4.2, sizeArcmin: 0.4 },
    { id: "mars", name: "Mars", N: 49.56, i: 1.85, w: 286.50, a: 1.524, e: 0.0934, M0: 19.37, n: 0.5240, mag: 0.5, sizeArcmin: 0.2 },
    { id: "jupiter", name: "Jupiter", N: 100.46, i: 1.30, w: 273.87, a: 5.204, e: 0.0485, M0: 20.02, n: 0.0831, mag: -2.3, sizeArcmin: 0.75 },
    { id: "saturn", name: "Saturn", N: 113.67, i: 2.49, w: 339.39, a: 9.582, e: 0.0555, M0: 317.02, n: 0.0335, mag: 0.6, sizeArcmin: 0.3 },
    { id: "uranus", name: "Uranus", N: 74.01, i: 0.77, w: 96.99, a: 19.191, e: 0.0463, M0: 142.24, n: 0.0117, mag: 5.7, sizeArcmin: 0.06 },
    { id: "neptune", name: "Neptune", N: 131.78, i: 1.77, w: 273.18, a: 30.07, e: 0.0095, M0: 256.23, n: 0.0059, mag: 7.8, sizeArcmin: 0.04 }
  ];

  const earthEclLng = norm(sunEclLng + 180);
  const R = 1.000;

  const solSysList = [
    { id: "sun", name: "Sun", ra: sunRa, dec: sunDec, mag: -26.7, category: "SolarSystem", typeName: "Star / Solar", color: "#ffcc00", sizeArcmin: 32 },
    { id: "moon", name: `Moon (${illuminated}% Illum)`, ra: moonRa, dec: moonDec, mag: -12.6, category: "SolarSystem", typeName: "Moon", color: "#e6e6e6", sizeArcmin: 31 }
  ];

  planets.forEach(p => {
    const M = norm(p.M0 + p.n * d) * RAD;
    const E = M + p.e * Math.sin(M);
    const xv = p.a * (Math.cos(E) - p.e);
    const yv = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);
    const v = Math.atan2(yv, xv);
    const r = Math.sqrt(xv * xv + yv * yv);
    
    const l = norm((v * DEG) + p.w);
    const xh = r * Math.cos(l * RAD);
    const yh = r * Math.sin(l * RAD);
    
    const xg = xh + R * Math.cos(earthEclLng * RAD);
    const yg = yh + R * Math.sin(earthEclLng * RAD);
    
    const geoLng = norm(Math.atan2(yg, xg) * DEG);
    const ra = norm(Math.atan2(Math.sin(geoLng * RAD) * Math.cos(eps), Math.cos(geoLng * RAD)) * DEG);
    const dec = Math.asin(Math.sin(geoLng * RAD) * Math.sin(eps)) * DEG;

    solSysList.push({
      id: p.id,
      name: p.name,
      ra: ra,
      dec: dec,
      mag: p.mag,
      category: "SolarSystem",
      typeName: "Planet",
      color: "#ffb703",
      sizeArcmin: p.sizeArcmin
    });
  });

  return solSysList;
}

function calcExposure(category, mag) {
  if (category === "SolarSystem") return "Instant / Solar Filter";
  let base = 5;
  if (category === "Cluster") base = 3;
  else if (category === "Galaxy") base = 15;
  else if (category === "Nebula") base = 10;

  const mins = Math.min(60, Math.max(2, Math.round(base * Math.pow(1.35, Math.max(0, mag - 4)))));
  return mins < 60 ? `${mins} mins` : "1 hr+";
}

function getAzDiff(targetAz, centerAz) {
  let diff = (targetAz - centerAz) % 360;
  if (diff < -180) diff += 360;
  if (diff > 180) diff -= 360;
  return diff;
}

function raDecToAltAz(raDeg, decDeg, latDeg, lngDeg, now) {
  const lat = latDeg * RAD;
  const dec = decDeg * RAD;
  
  const d = (now - new Date(Date.UTC(2000, 0, 1, 12, 0, 0))) / 86400000;
  const gst = (280.4606183 + 360.98564736629 * d) % 360;
  const lst = (gst + lngDeg + 360) % 360;
  
  const ha = (lst - raDeg + 360) % 360 * RAD;
  const alt = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(-Math.cos(dec) * Math.sin(ha), Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.sin(lat) * Math.cos(ha));
  
  return { alt: alt / RAD, az: (az / RAD + 360) % 360 };
}

function renderFraming(obj, pos) {
  const canvas = document.getElementById('fovCanvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;

  ctx.clearRect(0, 0, width, height);

  ctx.fillStyle = "#ffffff";
  for(let i = 0; i < 35; i++) {
    const sx = (Math.sin(i * 99 + obj.ra) * 0.5 + 0.5) * width;
    const sy = (Math.cos(i * 33 + obj.dec) * 0.5 + 0.5) * height;
    ctx.globalAlpha = (i % 5 + 1) / 6;
    ctx.beginPath();
    ctx.arc(sx, sy, (i % 3 === 0) ? 1.5 : 1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1.0;

  const dwarfFovArcmin = 84; 
  const pxPerArcmin = width / dwarfFovArcmin;
  const targetPx = Math.max(4, obj.sizeArcmin * pxPerArcmin);

  ctx.save();
  ctx.translate(width / 2, height / 2);
  
  if (obj.category === "Galaxy") {
    ctx.fillStyle = "rgba(100, 200, 255, 0.4)";
    ctx.strokeStyle = "#00d2ff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, targetPx / 2, targetPx / 4, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else if (obj.category === "Nebula") {
    ctx.fillStyle = "rgba(255, 100, 200, 0.35)";
    ctx.strokeStyle = "#ff64c8";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, targetPx / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else if (obj.category === "Cluster") {
    ctx.fillStyle = "rgba(0, 255, 170, 0.35)";
    ctx.strokeStyle = "#00ffaa";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, targetPx / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else if (obj.category === "SolarSystem") {
    ctx.fillStyle = obj.color || "#ffb703";
    ctx.beginPath();
    ctx.arc(0, 0, Math.min(width/4, Math.max(3, targetPx/2)), 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#00d2ff";
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(2, targetPx / 3), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = "rgba(255, 0, 85, 0.7)";
  ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, width - 20, height - 20);
  
  ctx.strokeStyle = "rgba(255, 0, 85, 0.3)";
  ctx.beginPath();
  ctx.moveTo(width / 2 - 15, height / 2); ctx.lineTo(width / 2 + 15, height / 2);
  ctx.moveTo(width / 2, height / 2 - 15); ctx.lineTo(width / 2, height / 2 + 15);
  ctx.stroke();

  document.getElementById('fovTitle').textContent = obj.name;
  const fitPercentage = Math.round((obj.sizeArcmin / dwarfFovArcmin) * 100);
  document.getElementById('fovMetrics').innerHTML = `
    <strong>Type:</strong> ${obj.typeName}<br>
    <strong>Apparent Size:</strong> ${obj.sizeArcmin}' arcmin<br>
    <strong>FOV Coverage:</strong> ~${fitPercentage}% of Dwarf Sensor Field<br>
    <strong>Altitude:</strong> ${pos.alt.toFixed(1)}° | <strong>Azimuth:</strong> ${pos.az.toFixed(1)}°<br>
    <strong>Est. Stack Time:</strong> ${calcExposure(obj.category, obj.mag)}
  `;
}

function render() {
  const lat = parseFloat(document.getElementById('lat').value) || 0;
  const lng = parseFloat(document.getElementById('lng').value) || 0;
  const centerAz = parseFloat(document.getElementById('azimuth').value) || 300;
  const fov = parseFloat(document.getElementById('fov').value) || 90;
  const minAlt = parseFloat(document.getElementById('minAlt').value) || 20;
  const searchText = (document.getElementById('txtSearch').value || "").toLowerCase().trim();

  const showSolar = document.getElementById('chkSolar').checked;
  const showGalaxies = document.getElementById('chkGalaxy').checked;
  const showNebulae = document.getElementById('chkNebula').checked;
  const showClusters = document.getElementById('chkCluster').checked;
  const showStars = document.getElementById('chkStar').checked;

  const horizonY = 500 * (1 - (minAlt / 90));
  document.getElementById('horizon').setAttribute('y', horizonY);
  document.getElementById('horizon').setAttribute('height', 500 - horizonY);
  document.getElementById('horizonLine').setAttribute('y1', horizonY);
  document.getElementById('horizonLine').setAttribute('y2', horizonY);

  const targetsGroup = document.getElementById('targetsGroup');
  const targetList = document.getElementById('targetList');
  targetsGroup.innerHTML = '';
  targetList.innerHTML = '';

  const now = new Date();
  const solarSystemObjects = getSolarSystemObjects(now);
  const fullCatalog = [...solarSystemObjects, ...CATALOG_DSO];

  let selectedObjObj = null;
  let selectedObjPos = null;
  let visibleCount = 0;

  fullCatalog.forEach(obj => {
    if (obj.category === 'SolarSystem' && !showSolar) return;
    if (obj.category === 'Galaxy' && !showGalaxies) return;
    if (obj.category === 'Nebula' && !showNebulae) return;
    if (obj.category === 'Cluster' && !showClusters) return;
    if (obj.category === 'Star' && !showStars) return;

    const pos = raDecToAltAz(obj.ra, obj.dec, lat, lng, now);
    const azDiff = getAzDiff(pos.az, centerAz);
    const inWindow = Math.abs(azDiff) <= fov / 2;
    const isVisible = inWindow && pos.alt >= minAlt;
    const isSelected = obj.id === selectedTargetId;

    if (isSelected) {
      selectedObjObj = obj;
      selectedObjPos = pos;
    }

    if (inWindow) {
      const x = 400 + (azDiff / (fov / 2)) * 400;
      const y = 500 * (1 - (pos.alt / 90));

      let dotColor = "#00d2ff";
      let dotRadius = "6";
      if (obj.category === 'Star') { dotColor = "#ffffff"; dotRadius = "3"; }
      else if (obj.category === 'Nebula') { dotColor = "#ff64c8"; dotRadius = "6"; }
      else if (obj.category === 'Cluster') { dotColor = "#00ffaa"; dotRadius = "6"; }
      else if (obj.category === 'SolarSystem') { dotColor = obj.color || "#ffb703"; dotRadius = "8"; }

      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", "target-node");
      group.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedTargetId = obj.id;
        render();
      });

      if (isSelected) {
        const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        ring.setAttribute("cx", x);
        ring.setAttribute("cy", y);
        ring.setAttribute("r", "14");
        ring.setAttribute("fill", "none");
        ring.setAttribute("stroke", "#ff0055");
        ring.setAttribute("stroke-width", "2");
        ring.setAttribute("stroke-dasharray", "3 2");
        group.appendChild(ring);
      }

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", x);
      circle.setAttribute("cy", y);
      circle.setAttribute("r", dotRadius);
      circle.setAttribute("fill", isVisible ? (isSelected ? "#ff0055" : dotColor) : "#555555");
      group.appendChild(circle);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", x + 10);
      text.setAttribute("y", y + 4);
      text.setAttribute("fill", isSelected ? "#ff0055" : (isVisible ? "#ffffff" : "#777777"));
      text.setAttribute("font-size", isSelected ? "14" : "11");
      text.setAttribute("font-weight", isSelected ? "bold" : "normal");
      text.textContent = `${obj.name} (${pos.alt.toFixed(1)}°)`;
      group.appendChild(text);

      targetsGroup.appendChild(group);

      const matchesSearch = searchText === "" || obj.name.toLowerCase().includes(searchText) || obj.typeName.toLowerCase().includes(searchText) || obj.id.toLowerCase().includes(searchText);

      if (isVisible && obj.category !== 'Star' && matchesSearch) {
        visibleCount++;
        const card = document.createElement('div');
        const isSolar = obj.category === 'SolarSystem';
        const isNebula = obj.category === 'Nebula';
        const isCluster = obj.category === 'Cluster';
        
        let cardTypeClass = '';
        if (isSolar) cardTypeClass = 'solar-sys';
        else if (isNebula) cardTypeClass = 'nebula';
        else if (isCluster) cardTypeClass = 'cluster';

        card.className = `card ${cardTypeClass} ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `
          <strong>${obj.name}</strong><br>
          Type: ${obj.typeName} | Mag: ${obj.mag}<br>
          Alt: ${pos.alt.toFixed(1)}° | Az: ${pos.az.toFixed(1)}°<br>
          <div class="badge ${isSolar ? 'solar' : ''}">⏱ Est. Stack: ${calcExposure(obj.category, obj.mag)}</div>
        `;
        card.addEventListener('click', () => {
          selectedTargetId = obj.id;
          render();
        });
        targetList.appendChild(card);
      }
    }
  });

  document.getElementById('visibleCount').textContent = visibleCount;

  if (selectedObjObj && selectedObjPos) {
    renderFraming(selectedObjObj, selectedObjPos);
  }
}

// Mouse Pan & Zoom Control Logic
const viewport = document.getElementById('viewport');
let isDragging = false;
let startX = 0;
let startAzimuth = 0;

viewport.addEventListener('mousedown', (e) => {
  if (e.target.closest('.map-controls')) return;
  isDragging = true;
  startX = e.clientX;
  startAzimuth = parseFloat(document.getElementById('azimuth').value) || 300;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - startX;
  const currentFov = parseFloat(document.getElementById('fov').value) || 90;
  const azDelta = (dx / viewport.clientWidth) * currentFov;
  let newAz = norm(startAzimuth - azDelta);
  document.getElementById('azimuth').value = Math.round(newAz);
  render();
});

window.addEventListener('mouseup', () => { isDragging = false; });

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  let fovInput = document.getElementById('fov');
  let currentFov = parseFloat(fovInput.value) || 90;
  let delta = e.deltaY > 0 ? 5 : -5;
  let newFov = Math.min(180, Math.max(20, currentFov + delta));
  fovInput.value = newFov;
  render();
}, { passive: false });

document.getElementById('btnZoomIn').addEventListener('click', () => {
  let fovInput = document.getElementById('fov');
  fovInput.value = Math.max(20, (parseFloat(fovInput.value) || 90) - 15);
  render();
});

document.getElementById('btnZoomOut').addEventListener('click', () => {
  let fovInput = document.getElementById('fov');
  fovInput.value = Math.min(180, (parseFloat(fovInput.value) || 90) + 15);
  render();
});

document.getElementById('btnReset').addEventListener('click', () => {
  document.getElementById('azimuth').value = 300;
  document.getElementById('fov').value = 90;
  render();
});

['lat', 'lng', 'azimuth', 'fov', 'minAlt', 'chkSolar', 'chkGalaxy', 'chkNebula', 'chkCluster', 'chkStar', 'txtSearch'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

document.getElementById('btnGps').addEventListener('click', () => {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(p => {
      document.getElementById('lat').value = p.coords.latitude.toFixed(4);
      document.getElementById('lng').value = p.coords.longitude.toFixed(4);
      render();
    }, () => alert("GPS unavailable. Please enter coordinates manually."));
  }
});

render();
</script>
